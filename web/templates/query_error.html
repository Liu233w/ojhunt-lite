<tr id="{{ row_id }}" class="result-row error" data-crawler="{{ crawler_name }}" data-username="{{ username }}">
    <td>{{ title }}</td>
    <td>{{ username }}</td>
    <td>N/A</td>
    <td>N/A</td>
    <td class="status error">ERROR: {{ error }}</td>
    <td>
        <span class="pending-controls">
            <button class="retry-btn" hx-get="/api/query/{{ crawler_name }}/{{ username }}"
                    hx-target="closest tr" hx-swap="outerHTML">
                Retry
            </button>
        </span>
        {% include "query_loading_controls.html" %}
    </td>
</tr>
