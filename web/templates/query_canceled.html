<tr id="{{ row_id }}" class="result-row error" data-crawler="{{ crawler_name }}" data-username="{{ username }}">
    <td>{{ title }}</td>
    <td>{{ username }}</td>
    <td>N/A</td>
    <td>N/A</td>
    <td class="status error">Canceled</td>
    <td>
        <button class="retry-btn" onclick="startQuery('{{ row_id }}', '{{ crawler_name }}', '{{ username }}')">
            Retry
        </button>
    </td>
</tr>
