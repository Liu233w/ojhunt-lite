<tr id="{{ row_id }}" class="result-row pending" data-crawler="{{ crawler_name }}" data-username="{{ username }}">
    <td>{{ title }}</td>
    <td>{{ username }}</td>
    <td>-</td>
    <td>-</td>
    <td class="status pending">Pending</td>
    <td>
        <span class="pending-controls">
            <button class="query-btn" hx-get="/api/query/{{ crawler_name }}/{{ username }}"
                    hx-target="closest tr" hx-swap="outerHTML">
                Query
            </button>
            <button class="remove-btn" onclick="removeRow('{{ row_id }}')">
                Remove
            </button>
        </span>
        {% include "query_loading_controls.html" %}
    </td>
</tr>
