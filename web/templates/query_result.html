<tr id="{{ row_id }}" class="result-row success" data-solved="{{ solved }}" data-submissions="{{ submissions }}" data-crawler="{{ crawler_name }}" data-username="{{ username }}">
    <td>{{ title }}</td>
    <td>{{ username }}</td>
    <td class="solved-count"><a href="#" onclick="document.getElementById('dialog-{{ row_id }}').showModal(); return false;">{{ solved }}</a></td>
    <td>{{ submissions }}</td>
    <td class="status">OK ({{ duration | round(2) }}s)</td>
    <td>
        <button class="retry-btn" hx-get="/api/query/{{ crawler_name }}/{{ username }}"
                hx-target="closest tr" hx-swap="outerHTML">
            Retry
        </button>
    </td>
</tr>
<dialog id="dialog-{{ row_id }}">
    <h3>{{ title }} ({{ username }}): {{ solved_list | length }} problems</h3>
    <div class="problems-list">{{ solved_list | sort | join(', ') }}</div>
    <div class="dialog-actions">
        <button class="primary" onclick="document.getElementById('dialog-{{ row_id }}').close()">Close</button>
    </div>
</dialog>
<script id="solved-list-{{ row_id }}" type="application/json">{{ solved_list | tojson }}</script>
