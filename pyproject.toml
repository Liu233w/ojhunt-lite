[project]
name = "ojhunt-lite"
version = "0.1.0"
description = "Lightweight tool for querying Online Judge statistics across multiple platforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "fastapi[standard]>=0.129.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "selectolax>=0.4.6",
    "uvicorn>=0.40.0",
]

[tool.ruff]
exclude = ["archived_crawlers"]

[tool.pytest.ini_options]
python_files = "*_test.py"
testpaths = ["crawlers", "cli", "web"]
markers = [
    "network: tests that make real HTTP requests",
    "playwright: tests that require a running web server",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.1",
]
