[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ojhunt"
version = "0.1.0"
description = "Lightweight tool for querying Online Judge statistics across multiple platforms"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "OJHunt Lite Contributors"},
]
keywords = ["competitive programming", "online judge", "codeforces", "atcoder", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "aiohttp>=3.13.3",
    "fastapi[standard]>=0.129.0",
    "jinja2>=3.1.6",
    "fpdf2>=2.7",
    "pypdf>=4.0",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "selectolax>=0.4.6",
    "uvicorn>=0.40.0",
    "matplotlib>=3.10.8",
]

[project.scripts]
ojhunt = "ojhunt:main"

[project.urls]
Homepage = "https://github.com/Liu233w/ojhunt-lite"
Repository = "https://github.com/Liu233w/ojhunt-lite"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "crawlers", "web"]
include = [
    "ojhunt.py",
    "web/templates/**",
    "web/static/**",
]

[tool.ruff]
exclude = ["archived_crawlers"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
testpaths = ["crawlers", "cli", "web"]
markers = [
    "network: tests that make real HTTP requests",
    "playwright: tests that require a running web server",
]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.1",
]
